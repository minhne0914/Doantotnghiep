<section class="pm-chart-grid" aria-label="Project charts">
    <article class="pm-panel pm-chart-wide">
        <div class="pm-panel-header">
            <div>
                <span class="pm-eyebrow">Delivery trend</span>
                <h2>Velocity theo sprint</h2>
            </div>
            <button class="pm-ghost-btn" type="button">8 sprint</button>
        </div>
        <div class="pm-chart-box"><canvas id="velocityChart"></canvas></div>
    </article>

    <article class="pm-panel">
        <div class="pm-panel-header">
            <div>
                <span class="pm-eyebrow">Capacity</span>
                <h2>Tải nhân sự</h2>
            </div>
        </div>
        <div class="pm-chart-box"><canvas id="workloadChart"></canvas></div>
    </article>

    <article class="pm-panel">
        <div class="pm-panel-header">
            <div>
                <span class="pm-eyebrow">Portfolio</span>
                <h2>Tình trạng dự án</h2>
            </div>
        </div>
        <div class="pm-chart-box pm-donut-box"><canvas id="portfolioChart"></canvas></div>
    </article>
</section>
