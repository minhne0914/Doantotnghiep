<style>
  .screening-companion {
    margin: 20px 0;
    border: 1px solid #d7e3ee;
    border-radius: 16px;
    padding: 18px;
    background: #f8fbfe;
    color: #17324d;
  }
  .screening-companion.follow-up { border-color: #f5c2c7; background: #fff8f8; }
  .screening-companion h5 { margin: 0 0 8px; color: #17324d; }
  .screening-companion > p { margin: 0 0 14px; line-height: 1.55; }
  .screening-companion-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .screening-companion-section { padding: 14px; border-radius: 12px; background: #fff; }
  .screening-companion-section strong { display: block; margin-bottom: 7px; }
  .screening-companion-section ul { margin: 0; padding-left: 18px; }
  .screening-companion-section li { margin-bottom: 6px; }
  .screening-companion-warning { color: #8a3c12; background: #fff7ed; }
  @media (max-width: 767px) { .screening-companion-grid { grid-template-columns: 1fr; } }
</style>

{% if result_support %}
<section class="screening-companion {{ result_support.tone }}" aria-label="Hướng dẫn sau sàng lọc">
  <h5><i class="fas fa-hand-holding-heart mr-2"></i>Điều quan trọng sau kết quả này</h5>
  <p>{{ result_support.message }}</p>
  <div class="screening-companion-grid">
    <div class="screening-companion-section">
      <strong><i class="fas fa-list-check mr-1"></i>Việc bạn có thể làm tiếp theo</strong>
      <ul>{% for step in result_support.steps %}<li>{{ step }}</li>{% endfor %}</ul>
    </div>
    <div class="screening-companion-section screening-companion-warning">
      <strong><i class="fas fa-triangle-exclamation mr-1"></i>Khi nào cần hỗ trợ khẩn</strong>
      <span>{{ result_support.urgent_signs }}</span>
    </div>
  </div>
</section>
{% endif %}
