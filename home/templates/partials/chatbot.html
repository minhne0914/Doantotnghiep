{% url 'login' as chatbot_login_url %}
<style>
#chatbotToggle {
    position: fixed;
    right: max(24px, env(safe-area-inset-right));
    bottom: max(24px, env(safe-area-inset-bottom));
    width: auto;
    min-width: 154px;
    height: 58px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, #0891b2 0%, #0f766e 54%, #134e4a 100%);
    color: #fff;
    box-shadow: 0 14px 32px rgba(8, 145, 178, 0.38), 0 0 0 5px rgba(8, 145, 178, 0.12);
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 0 18px 0 12px;
    font-size: 16px;
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
    z-index: 2147483000;
    opacity: 1 !important;
    visibility: visible !important;
    pointer-events: auto;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
}

#chatbotToggle:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 38px rgba(8, 145, 178, 0.46), 0 0 0 7px rgba(8, 145, 178, 0.16);
}

#chatbotToggle:focus-visible {
    outline: 3px solid rgba(14, 165, 233, 0.35);
    outline-offset: 4px;
}

#chatbotToggle .chatbot-toggle-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    font-size: 20px;
}

.chatbot-toggle-text {
    letter-spacing: 0;
    white-space: nowrap;
}

.chatbot-toggle-status {
    position: absolute;
    top: -5px;
    right: -5px;
    width: 18px;
    height: 18px;
    border: 3px solid #fff;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55);
    animation: chatbotPulse 1.8s infinite;
}

@keyframes chatbotPulse {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
    70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

#chatContainer {
    position: fixed;
    right: max(24px, env(safe-area-inset-right));
    bottom: 106px;
    width: 380px;
    max-width: calc(100vw - 24px);
    height: 560px;
    max-height: calc(100vh - 140px);
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(15, 23, 42, 0.28);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 2147483001;
}

#chatHeader {
    background: linear-gradient(135deg, #0f766e, #115e59);
    color: #fff;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.chat-title { display: flex; flex-direction: column; gap: 2px; }
.chat-title strong { font-size: 15px; }
.chat-title span { font-size: 12px; color: rgba(255, 255, 255, 0.82); }

.chat-actions { display: flex; align-items: center; gap: 8px; }
.chat-action-btn {
    border: 1px solid rgba(255,255,255,0.25);
    background: transparent;
    color: #fff;
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
}

#chatStatus {
    padding: 10px 16px;
    font-size: 12px;
    color: #0f172a;
    background: #ecfeff;
    border-bottom: 1px solid #dbeafe;
}

#chatMessages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    background:
        radial-gradient(circle at top right, rgba(186, 230, 253, 0.35), transparent 30%),
        linear-gradient(180deg, #f8fafc, #eef6f7);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.chat-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-width: 85%;
}

.chat-row.user { align-self: flex-end; align-items: flex-end; }
.chat-row.bot { align-self: flex-start; align-items: flex-start; }

.chat-bubble {
    padding: 12px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
    white-space: normal;
    word-break: break-word;
}

.chat-bubble.user {
    background: linear-gradient(135deg, #0891b2, #0f766e);
    color: #fff;
    border-bottom-right-radius: 4px;
}

.chat-bubble.bot {
    background: #fff;
    color: #0f172a;
    border: 1px solid #e2e8f0;
    border-bottom-left-radius: 4px;
}

.chat-time {
    font-size: 11px;
    color: #64748b;
}

.chat-quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
}

.chat-quick-action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
    border-radius: 999px;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    color: #0f172a;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
}

.chat-quick-action:hover {
    color: #0f172a;
    text-decoration: none;
    background: #eef6f7;
}

.chat-quick-action.primary {
    border-color: #0e8da5;
    color: #075985;
    background: #ecfeff;
}

.chat-quick-action.success {
    border-color: #22c55e;
    color: #166534;
    background: #ecfdf5;
}

.chat-quick-action.danger {
    border-color: #ef4444;
    color: #991b1b;
    background: #fef2f2;
}

.chat-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 14px 0;
    background: #fff;
}

.chat-suggestion {
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    background: #f8fafc;
    color: #334155;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.chat-suggestion:hover {
    background: #ecfeff;
    border-color: #0891b2;
    color: #075985;
}

#chatInputContainer {
    padding: 14px;
    border-top: 1px solid #e2e8f0;
    background: #fff;
}

.chat-input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
}

#chatInput {
    flex: 1;
    min-height: 44px;
    max-height: 120px;
    border: 1px solid #cbd5e1;
    border-radius: 16px;
    padding: 10px 14px;
    resize: none;
    outline: none;
}

#chatSend {
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 14px;
    background: #0f766e;
    color: #fff;
    cursor: pointer;
}

#chatSend:disabled,
.chat-action-btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.chat-login-link {
    display: none;
    align-items: center;
    justify-content: center;
    min-height: 46px;
    padding: 0 16px;
    border-radius: 14px;
    background: #0f766e;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
}

.chat-login-link:hover {
    color: #fff;
    text-decoration: none;
    background: #115e59;
}

.typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.typing-indicator span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #94a3b8;
    animation: typing 1.2s infinite ease-in-out;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

@keyframes typing {
    0%, 80%, 100% { transform: scale(0.65); opacity: 0.6; }
    40% { transform: scale(1); opacity: 1; }
}

@media (max-width: 640px) {
    #chatContainer {
        right: 12px;
        left: 12px;
        bottom: 88px;
        width: auto;
        height: 72vh;
    }

    #chatbotToggle {
        right: 16px;
        bottom: 16px;
        min-width: 138px;
        height: 54px;
        padding: 0 16px 0 10px;
    }

    #chatbotToggle .chatbot-toggle-icon {
        width: 36px;
        height: 36px;
    }
}

@media (max-width: 420px) {
    #chatbotToggle {
        width: 58px;
        min-width: 58px;
        height: 58px;
        padding: 0;
        border-radius: 50%;
    }

    #chatbotToggle .chatbot-toggle-icon {
        width: 58px;
        height: 58px;
        background: transparent;
        font-size: 23px;
    }

    .chatbot-toggle-text {
        display: none;
    }
}
</style>

<button id="chatbotToggle" type="button" onclick="toggleChat()" aria-label="Mở Medic AI" title="Mở Medic AI">
    <span class="chatbot-toggle-icon" aria-hidden="true"><i class="fas fa-robot"></i></span>
    <span class="chatbot-toggle-text">Medic AI</span>
    <span class="chatbot-toggle-status" aria-hidden="true"></span>
</button>

<div id="chatContainer">
    <div id="chatHeader">
        <div class="chat-title">
            <strong><i class="fas fa-stethoscope mr-1"></i> Medic AI</strong>
            <span>Trợ lý sức khỏe và lịch khám cá nhân</span>
        </div>
        <div class="chat-actions">
            <button id="clearChatBtn" class="chat-action-btn" type="button" onclick="clearChat()">Xóa chat</button>
            <button class="chat-action-btn" type="button" onclick="toggleChat()">Đóng</button>
        </div>
    </div>

    <div id="chatStatus">Sẵn sàng hỗ trợ. Lịch sử trò chuyện sẽ được lưu trong tài khoản của bạn.</div>
    <div id="chatMessages"></div>

    <div id="chatInputContainer">
        <div class="chat-suggestions" id="chatSuggestions">
            <button class="chat-suggestion" type="button" data-message="Hôm nay tôi có lịch khám không?">Lịch hôm nay</button>
            <button class="chat-suggestion" type="button" data-message="Tìm lịch khám tim mạch còn trống trong tuần này">Tìm tim mạch</button>
            <button class="chat-suggestion" type="button" data-message="Cho tôi xem các kết quả sàng lọc AI gần đây">Kết quả AI</button>
            <button class="chat-suggestion" type="button" data-message="Tôi bị đau ngực và khó thở">Tư vấn khẩn cấp</button>
        </div>
        <div class="chat-input-row">
            <textarea id="chatInput" rows="2" maxlength="1000" placeholder="Hỏi về bác sĩ, lịch khám, triệu chứng hoặc kết quả sàng lọc AI..."></textarea>
            <button id="chatSend" type="button" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
            <a id="chatLoginLink" class="chat-login-link" href="{{ chatbot_login_url }}?next={{ request.get_full_path|urlencode }}">Đăng nhập</a>
        </div>
    </div>
</div>

<script>
    const chatUserAuthenticated = {{ request.user.is_authenticated|yesno:"true,false" }};
    const chatCsrfToken = '{{ csrf_token }}';
    let chatLoaded = false;
    let chatBusy = false;

    function getCsrfToken() {
        const csrfCookie = document.cookie.split('; ').find(row => row.startsWith('csrftoken='));
        return csrfCookie ? csrfCookie.split('=')[1] : chatCsrfToken;
    }

    function setChatStatus(message, tone = 'info') {
        const status = document.getElementById('chatStatus');
        const styles = {
            info: { bg: '#ecfeff', color: '#0f172a' },
            loading: { bg: '#eff6ff', color: '#1d4ed8' },
            success: { bg: '#ecfdf5', color: '#047857' },
            error: { bg: '#fef2f2', color: '#b91c1c' },
        };
        const style = styles[tone] || styles.info;
        status.textContent = message;
        status.style.background = style.bg;
        status.style.color = style.color;
    }

    function escapeHtml(value) {
        return value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function formatMessageText(text) {
        let formatted = escapeHtml(text);
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
        formatted = formatted.replace(/\n/g, '<br>');
        return formatted;
    }

    function normalizeActions(actions) {
        if (!Array.isArray(actions)) return [];
        return actions
            .filter((action) => action && action.label && action.url)
            .slice(0, 4);
    }

    function appendMessage(sender, text, timestamp = '', actions = []) {
        const messages = document.getElementById('chatMessages');
        const row = document.createElement('div');
        row.className = `chat-row ${sender}`;

        const bubble = document.createElement('div');
        bubble.className = `chat-bubble ${sender}`;
        bubble.innerHTML = formatMessageText(text);

        row.appendChild(bubble);
        const quickActions = normalizeActions(actions);
        if (sender === 'bot' && quickActions.length) {
            const actionWrap = document.createElement('div');
            actionWrap.className = 'chat-quick-actions';
            quickActions.forEach((action) => {
                const link = document.createElement('a');
                link.className = `chat-quick-action ${action.tone || 'secondary'}`;
                link.href = action.url;
                link.innerHTML = `<i class="fas fa-external-link-alt"></i>${escapeHtml(action.label)}`;
                actionWrap.appendChild(link);
            });
            row.appendChild(actionWrap);
        }
        if (timestamp) {
            const time = document.createElement('div');
            time.className = 'chat-time';
            time.textContent = timestamp;
            row.appendChild(time);
        }

        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;
    }

    function showTyping() {
        const messages = document.getElementById('chatMessages');
        const row = document.createElement('div');
        row.className = 'chat-row bot';
        row.id = 'typingIndicator';

        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble bot';
        bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
        row.appendChild(bubble);

        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;
    }

    function hideTyping() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
    }

    function setBusyState(isBusy) {
        chatBusy = isBusy;
        document.getElementById('chatSend').disabled = isBusy;
        document.getElementById('clearChatBtn').disabled = isBusy;
        document.getElementById('chatInput').disabled = isBusy;
    }

    function showLoginPrompt() {
        const messages = document.getElementById('chatMessages');
        messages.innerHTML = '';
        appendMessage('bot', 'Bạn cần đăng nhập để sử dụng Medic AI và lưu lịch sử trò chuyện.');
        setChatStatus('Đăng nhập để bắt đầu trò chuyện với Medic AI.', 'info');
        document.getElementById('chatInput').disabled = true;
        document.getElementById('chatInput').placeholder = 'Đăng nhập để sử dụng Medic AI';
        document.getElementById('chatSend').style.display = 'none';
        document.getElementById('clearChatBtn').style.display = 'none';
        document.getElementById('chatLoginLink').style.display = 'inline-flex';
        chatLoaded = true;
    }

    async function loadChatHistory(force = false) {
        if (chatLoaded && !force) return;

        if (!chatUserAuthenticated) {
            showLoginPrompt();
            return;
        }

        setChatStatus('Đang tải lịch sử trò chuyện...', 'loading');
        try {
            const response = await fetch('/api/chat/history/');
            const data = await response.json();
            const messages = document.getElementById('chatMessages');
            messages.innerHTML = '';

            if (response.ok && Array.isArray(data.messages) && data.messages.length) {
                data.messages.forEach((message) => {
                    appendMessage(message.sender, message.message, message.created_at);
                });
                setChatStatus('Đã tải lịch sử trò chuyện gần nhất.', 'success');
            } else {
                appendMessage('bot', 'Xin chào, tôi là Medic AI. Bạn có thể hỏi về bác sĩ, lịch khám, triệu chứng và kết quả sàng lọc AI.');
                setChatStatus('Chưa có lịch sử chat. Hãy bắt đầu cuộc trò chuyện mới.', 'info');
            }
            chatLoaded = true;
        } catch (error) {
            setChatStatus('Không thể tải lịch sử chat lúc này.', 'error');
        }
    }

    function toggleChat() {
        const chat = document.getElementById('chatContainer');
        const isOpen = chat.style.display === 'flex';
        chat.style.display = isOpen ? 'none' : 'flex';

        if (!isOpen) {
            loadChatHistory();
            if (chatUserAuthenticated) {
                document.getElementById('chatInput').focus();
            }
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    async function sendMessage() {
        if (!chatUserAuthenticated) {
            showLoginPrompt();
            return;
        }

        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || chatBusy) return;

        appendMessage('user', text, 'Đang gửi...');
        input.value = '';
        setBusyState(true);
        setChatStatus('Medic AI đang suy nghĩ...', 'loading');
        showTyping();

        try {
            const response = await fetch('/api/chat/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken(),
                },
                body: JSON.stringify({ message: text }),
            });
            const data = await response.json().catch(() => ({}));
            hideTyping();

            if (response.ok) {
                appendMessage('bot', data.reply || 'AI chưa trả về nội dung hợp lệ.', '', data.actions || []);
                setChatStatus('Phản hồi đã được lưu vào lịch sử chat.', 'success');
            } else {
                appendMessage('bot', data.error || 'Xin lỗi, hệ thống AI tạm thời chưa phản hồi được.');
                setChatStatus('Đã gặp lỗi khi gửi tin nhắn.', 'error');
            }
        } catch (error) {
            hideTyping();
            appendMessage('bot', 'Lỗi kết nối mạng, vui lòng thử lại sau.');
            setChatStatus('Kết nối mạng không ổn định.', 'error');
        } finally {
            setBusyState(false);
            document.getElementById('chatInput').focus();
        }
    }

    async function clearChat() {
        if (!chatUserAuthenticated) {
            showLoginPrompt();
            return;
        }

        if (chatBusy) return;
        if (!confirm('Bạn có chắc muốn xóa toàn bộ lịch sử trò chuyện?')) return;

        setBusyState(true);
        setChatStatus('Đang xóa lịch sử trò chuyện...', 'loading');
        try {
            const response = await fetch('/api/chat/clear/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCsrfToken(),
                },
            });
            const data = await response.json().catch(() => ({}));

            if (response.ok && data.success) {
                const messages = document.getElementById('chatMessages');
                messages.innerHTML = '';
                appendMessage('bot', 'Lịch sử trò chuyện đã được xóa. Bạn có thể bắt đầu cuộc trò chuyện mới.');
                setChatStatus('Đã xóa toàn bộ lịch sử chat.', 'success');
            } else {
                setChatStatus(data.error || 'Không thể xóa lịch sử chat.', 'error');
            }
        } catch (error) {
            setChatStatus('Lỗi kết nối khi xóa lịch sử chat.', 'error');
        } finally {
            setBusyState(false);
        }
    }

    document.getElementById('chatSuggestions').addEventListener('click', function (event) {
        const button = event.target.closest('.chat-suggestion');
        if (!button) return;
        const input = document.getElementById('chatInput');
        input.value = button.dataset.message || '';
        sendMessage();
    });

    document.getElementById('chatInput').addEventListener('keydown', handleKeyPress);
</script>
