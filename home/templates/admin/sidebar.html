{% load static %}
<aside class="main-sidebar sidebar-dark-primary bg-gray-dark elevation-4">
    <a href="{% url 'home' %}" class="brand-link" style="text-align: center;">
        <i class="fa fa-university" aria-hidden="true"></i>
        <span class="brand-text font-weight-light">Home</span>
    </a>

    <div class="sidebar">
        <div class="user-panel mt-3 pb-3 mb-3 d-flex">
            <div class="image">
                <img src="{% if user_image %}{{ user_image }}{% else %}{% static 'vendor/adminlte/img/user2-160x160.jpg' %}{% endif %}"
                     class="img-circle elevation-2"
                     alt="User Image"
                     style="width: 50px; height: 50px; object-fit: cover;">
            </div>
            {% if request.user.is_authenticated and request.user.role == 'doctor' %}
            <div class="info">
                <a href="{% url 'doctor-profile' %}" class="d-block">Hello {{ request.user.last_name }}</a>
            </div>
            {% endif %}
        </div>

        <nav class="mt-2">
            <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
                <li class="nav-header mt-3 pb-3 mb-3" id="currentDate"></li>

                <li class="nav-item">
                    <a href="{% url 'doctor-dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'doctor-dashboard' %}active{% endif %}">
                        <i class="nav-icon fas fa-tachometer-alt"></i>
                        <p>Dashboard</p>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="{% url 'doctor-appointment' %}" class="nav-link {% if request.resolver_match.url_name == 'doctor-appointment' %}active{% endif %}">
                        <i class="nav-icon fas fa-calendar-alt"></i>
                        <p>Appointments</p>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="{% url 'doctor-profile' %}" class="nav-link {% if request.resolver_match.url_name == 'doctor-profile' %}active{% endif %}">
                        <i class="nav-icon fas fa-user-md"></i>
                        <p>Profile</p>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="{% url 'patient-list' %}" class="nav-link {% if request.resolver_match.url_name == 'patient-list' %}active{% endif %}">
                        <i class="nav-icon fas fa-procedures"></i>
                        <p>Patients</p>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="{% url 'doctor-inbox' %}" class="nav-link {% if request.resolver_match.url_name == 'doctor-inbox' or request.resolver_match.url_name == 'doctor-inbox-detail' %}active{% endif %}">
                        <i class="nav-icon fas fa-comments"></i>
                        <p>Messages</p>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</aside>

<script>
    const currentDateSpan = document.getElementById('currentDate');
    if (currentDateSpan) {
        const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const currentDate = new Date();
        const dayOfWeek = currentDate.getDay();
        const day = currentDate.getDate();
        const month = currentDate.getMonth() + 1;
        const year = currentDate.getFullYear();
        currentDateSpan.textContent = `${daysOfWeek[dayOfWeek]} (${day}/${month}/${year})`;
    }
</script>
